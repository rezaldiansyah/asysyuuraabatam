# Renstra 2025–2030 Yayasan Asy Syuuraa Batam

## 1. Arah Yayasan
- **Visi:** insan yang memahami dan mengamalkan Iman, Islam, dan Ihsan, serta bertakwa sepanjang hayat
- **Misi (5)**
  - M1 Kurikulum Nasional dipadukan dengan ajaran Islam
  - M2 Kenal jati diri & makna hidup
  - M3 Disiplin, IPTEK tinggi berbasis Iman-Islam-Ihsan
  - M4 Lingkungan penuh kasih sayang
  - M5 Keteladanan & pengembangan potensi
- **Tujuan Strategis**
  - T1 Lulusan hafal Qur'an, berakhlak, kuasai IT
  - T2 SDM berakhlak, profesional, sejahtera
  - T3 Sarpras asri, nyaman, aman
  - T4 Brand nomor 1 di Kota Batam
- **7 Target Utama Lulusan (pimpinan, Raker 29)**
  - Iman · Adab · Tahfidz 5 juz
  - Hadits Arbain · Matan Urjuzah Mi'iyah
  - Fisik kuat · Pengetahuan umum unggul
  - Perlu disatukan dengan T1 lewat **SK Profil Lulusan**

## 2. Profil Lulusan RA (usulan)
- **Qur'an:** ½ juz 30 · lancar Wafa sesuai jilid
  - Titik awal 2025/26: 82% kuasai 8 surat/semester
- **Hadits pilihan:** 25 hadits pendek
  - Titik awal: rata-rata 10 dari 25
- **Doa harian:** minimal 15 doa
- **Matan Urjuzah:** pengenalan lewat audio/nasyid
- **Adab & 5S:** nilai adab minimal "Baik"
- **Praktik ibadah:** wudhu & gerakan shalat (RA-07)
- **Kemandirian & motorik:** checklist perkembangan (RA-06)
- **Kesinambungan:** persentase lulusan yang melanjutkan ke SDIT

## 3. Profil Lulusan SDIT (usulan)
- **Tahfidz:** 5 juz (26–30), bertahap per angkatan
  - Masa peralihan: angkatan lulus 2027 target 2 juz
  - Titik awal: kelas 6 baru 14% capai target kelas
- **Tilawah:** tuntas Wafa 5, gharib, dan tajwid
- **Hadits Arbain:** 20 hadits (usulan)
- **Matan Urjuzah:** 50 bait (usulan)
- **Ibadah:** shalat lima waktu dan dhuha, terjaga minimal 8 dari 10 hari di mutabaah
- **Praktik ibadah kelas 6:** imam, adzan, shalat jenazah
- **Akademik:** nilai TKA literasi dan numerasi, rata-rata nilai ujian sekolah
- **IT:** literasi digital dasar, lulus uji praktik
- **Bahasa:** Arab (mufradat harian), Inggris dasar
- **Fisik:** lulus tes kebugaran sederhana
- **Adab:** dinilai guru dan orang tua dengan lembar adab
- **Kesinambungan:** persentase lulusan yang melanjutkan ke SMPIT

## 4. Profil Lulusan SMPIT (usulan)
- **Tahfidz:** 5 juz (26–30)
  - Kelas 7: juz 30 & 29
  - Kelas 8: juz 28 & 27
  - Kelas 9: juz 26
  - Jalur alumni SDIT dipercepat
- **Hadits Arbain:** 42 hadits lengkap
- **Matan Urjuzah:** 100 bait
- **Ibadah:** shalat lima waktu dan dhuha, terjaga minimal 8 dari 10 hari di mutabaah (SMP-13)
- **Praktik ibadah:** kelas 7 imam, kelas 8 khutbah/kultum, kelas 9 shalat jenazah & keputrian (SMP-16)
- **Akademik:** Matematika dan IPA tuntas sesuai kriteria ketuntasan · TKA/ANBK
- **IT:** proyek digital / coding
- **Bahasa:** Arab & Inggris level ditetapkan
- **Fisik:** tes kebugaran, program wajib semua siswa
- **Kepemimpinan:** peran OSIS/regu, LDKS
- **Kesinambungan:** persentase lulusan yang diterima di SMA/MA pilihan

## 5. Program & Kurikulum per Target
### Tahfidz & Tilawah
- **Harian:** setoran & muraja'ah (halaqah TTQ)
- **Pekanan:** tasmi' berpasangan
- **Semester:** karantina/camp Qur'an, tasmi' per juz
- **Tahunan:** munaqosyah (terpisah dari wisuda)
- **Kurikulum:** target juz per kelas & per semester
- **SDM:** rasio guru TTQ 1:10
### Hadits Arbain & Matan Urjuzah
- **Harian:** "15 Menit Berkah" 07.15–07.30
- **Pekanan:** 1 hadits atau 1 bait per pekan, lalu disetor
- **Semester:** uji hafalan, lomba hafalan (bukan nasyid)
- **Kurikulum:** modul hadits & matan per kelas
### Iman, Ibadah & Adab
- **Harian:** shalat berjamaah, dhuha, Al-Ma'tsurat, mutabaah
- **Pekanan:** halaqah adab (Modul Adab Murid)
- **Semester:** MABIT dengan target terukur
- **Kurikulum:** adab terintegrasi tiap mapel
### Pengetahuan Umum
- **Pekanan:** remedial & pengayaan, Sains & Math Club
- **Semester:** try out TKA/ANBK
- **Kurikulum:** pemetaan kemampuan, ketuntasan per mapel
- **Prasyarat:** guru linear / pelatihan, lab komputer
### IT & Bahasa
- **IT:** kurikulum TIK berjenjang, portofolio proyek
- **Bahasa Arab:** hari bahasa, mufradat berseri
- **Bahasa Inggris:** percakapan dasar, pentas bahasa
### Fisik Kuat
- **Wajib semua siswa:** senam/lari pagi pekanan
- **Ekskul:** panahan, silat (pilihan, bukan pengganti)
- **Ukur:** tes kebugaran tiap semester
### PHBI & PHBN
- **Syarat:** setiap kegiatan menyebutkan target lulusan yang dituju
- **Rincian per kegiatan:** lihat cabang 8
- **Diganti:** lomba yang tidak terkait target lulusan (misalnya lomba makan kerupuk)

### Peta target lulusan ke agenda PHBI/PHBN
- **Tahfidz Qur'an** (13 agenda): Tahun Baru Hijriah, Maulid Nabi, Isra' Mi'raj, Ramadhan, Idul Fitri, Idul Adha, HUT RI, Hari Kartini, Hardiknas, Hari Santri, Sumpah Pemuda, Hari Pahlawan, Hari Guru
- **Hadits Arbain** (6 agenda): Tahun Baru Hijriah, Maulid Nabi, Isra' Mi'raj, Idul Fitri, Hari Santri, Hari Guru
- **Matan Urjuzah** (3 agenda): Tahun Baru Hijriah, Maulid Nabi, Hari Pahlawan
- **Adab** (10 agenda): Tahun Baru Hijriah, Maulid Nabi, Idul Fitri, Idul Adha, HUT RI, Hari Kartini, Hardiknas, Hari Santri, Sumpah Pemuda, Hari Guru
- **Fisik kuat** (5 agenda): Ramadhan, HUT RI, Hari Kartini, Sumpah Pemuda, Hari Pahlawan
- **Pengetahuan umum** (4 agenda): Idul Adha, HUT RI, Hari Kartini, Hardiknas
- **Iman & ibadah** (5 agenda): Tahun Baru Hijriah, Isra' Mi'raj, Ramadhan, Idul Adha, Hari Guru
- **IT & digital** (6 agenda): semua agenda berkarya digital di Fase C dan SMP
- **Bahasa** (2 agenda): Hari Kartini, Sumpah Pemuda
- Peta ini dipakai saat Raker untuk melihat target mana yang masih jarang disentuh

## 6. Program Pendukung (T2–T4)
### SDM (T2)
- Rekrutmen guru TTQ & guru linear
- Rapor guru, BPI
- **Mutabaah yaumiyah guru → bahan rapor guru**
  - Amalan pokok: shalat berjamaah, tilawah, dhuha, qiyamul lail, kajian pekanan
  - Diisi harian, direkap bulanan oleh Tim Tarbiyah
  - Kaitan ke siswa: guru yang menjaga amalan menjadi teladan adab & ibadah
  - Ukuran: keteraturan mengisi (GR-01), capaian amalan pokok (GR-02), rapor guru terbit tepat waktu (GR-03)
  - Cek awal: rekap bulan sebelum pembinaan · cek akhir: rekap bulan pertama; selanjutnya dipantau bulanan
  - Catatan: alat pembinaan, bobot kecil di rapor guru; kejujuran mengisi lebih penting dari angka tinggi; rekap pribadi hanya untuk Tim Tarbiyah dan kepala unit
- **Buku kurikulum mandiri (adab, hadits, matan, tahfidz)**
  - Alur: susun → telaah Tim Tarbiyah → uji coba 1 kelas per unit → perbaiki → pakai di semua kelas
  - Ukuran: bab selesai sesuai jadwal (BK-01), kelas yang memakai (BK-02), dampaknya pada siswa (BK-03)
  - Cek awal: lembar adab kelas uji coba di awal semester · cek akhir: setelah bab 3; dipantau lagi di akhir semester
  - Buku dinilai dari dampaknya saat dipakai, bukan saat selesai dicetak
- Target guru bertahan (tidak keluar) dan kehadiran guru
### Sarana Prasarana & Sistem Informasi (T3)
- Lab komputer untuk TKA/ANBK & IT
- Satu sistem data siswa: setoran, nilai, mutabaah
### Brand & SPMB (T4)
- Target pendaftar dan lulusan yang melanjutkan dari RA ke SD ke SMP
- Promosi berbasis bukti capaian lulusan

## 7. Monitoring & Evaluasi
- **Mingguan:** progres siswa per halaqah/kelas
- **Bulanan:** laporan 1 halaman per unit (% siswa sesuai jalur untuk tiap ukuran keberhasilan)
- **Semester (Raker):** capaian dibandingkan target; program dilanjutkan, diubah, atau dihentikan
- **Raker juga menetapkan:** ketua panitia tiap agenda PHBI/PHBN dan pagu anggarannya, sekitar 6 bulan sebelum hari H
- **Kegiatan PHBI/PHBN:** setiap tujuan dicek sebelum kegiatan dan saat kegiatan (paling lambat sepekan sesudahnya); hasilnya ditulis di LPJ (cabang 8)
- **Syarat anggaran:** program yang belum jelas ukuran keberhasilannya disempurnakan dulu sebelum didanai

## 8. PHBI & PHBN: Penerapan per Kegiatan
### Cara membaca peta ini
- **1.** Pilih agenda, misalnya Hari Guru
- **2.** Baca tema, ayat, tadabbur, dan sirahnya
- **3.** Buka fase kelas Anda: RA, SD Fase A (kelas 1–2), SD Fase B (kelas 3–4), SD Fase C (kelas 5–6), SMP
- **4.** Di setiap fase ada dua cabang
  - 🎯 **Tujuan dan cara menilainya:** 3 tujuan (hafalan, paham atau terampil, dan amal), lengkap dengan cek awal, cek akhir, batas berhasil, dan penanggung jawabnya
  - 🧩 **Pilihan kegiatan:** untuk tiap tujuan tersedia 2 pilihan, A dijalankan di sekolah dan B berupa proyek siswa atau kegiatan bersama orang tua
- **5.** Pilih satu kegiatan untuk tiap tujuan, lalu jalankan dan catat hasilnya
- **6.** Cek dilakukan dua kali dengan cara yang sama
  - Cek awal: sebelum kegiatan, biasanya cukup memakai data yang sudah ada, yaitu buku setoran, mutabaah, lembar adab, atau jurnal kelas
  - Cek akhir: saat kegiatan atau paling lambat sepekan sesudahnya, tanpa persiapan khusus, lalu hasilnya ditulis di LPJ
- **7.** Bandingkan hasil cek akhir dengan batas berhasil
- **Setelah LPJ:** perkembangan berikutnya cukup dipantau lewat laporan bulanan biasa
- **🎖️ Target unggulan:** tiap agenda mengangkat satu target lulusan yang berbeda menjadi Tujuan 1, supaya ke-7 target utama terbagi rata sepanjang tahun
- **🌱 Menumbuhkan:** tiap agenda menyebut sisi visi (Iman, Islam, atau Ihsan) dan misi yang dijalankannya
- **📦 Hasil nyata:** setiap kegiatan menyebutkan karya atau catatan yang dihasilkan, sehingga karyanya sekaligus menjadi bukti saat cek akhir
- **Karya digital** (infografis, video, rekaman) hanya untuk SD Fase C dan SMP, dan ikut dihitung sebagai target literasi digital (SD-09) atau proyek digital (SMP-08)
- **Menyimak berpasangan:** untuk cek awal hafalan, siswa saling menyimak dengan kartu centang, lalu guru merekap dan menguji ulang 5 siswa acak. Penilaian lulus dan penjurian lomba tetap di tangan guru
- **Kode seperti SD-02:** nomor ukuran keberhasilan di lembar Kamus KPI pada Sheet, yang menghubungkan kegiatan dengan target lulusan
- **Aturan:** kegiatan yang tidak punya cara cek tidak dimasukkan ke peta
- **🏆 Lomba: semua siswa berlomba, hari H hanya babak final**
  - **Raker** ketua panitia dan pagu anggaran ditetapkan, sekitar 6 bulan sebelumnya · **H-90** panitia dilengkapi · **H-60** proposal dan anggaran diajukan · **H-45** Yayasan memberi catatan revisi · **H-30** proposal final disetujui dan anggaran dikunci
  - **H-28** cek awal · **H-14** rubrik dibagikan dan latihan mulai · **H-7** babak kelas · **hari H** final · **H+7** LPJ kegiatan · **H+14** LPJ keuangan
  - Babak kelas digelar di jam mapel terkait, dan **semua siswa dinilai** dengan lembar yang sama. Nilai inilah yang menjadi cek akhir
  - Tiga model seleksi yang bisa dipilih unit: menyatu dengan tugas mapel (tanpa waktu tambahan), sisipan 10–15 menit beberapa pertemuan, atau satu pertemuan penuh
  - Hari H hanya finalis yang tampil, dinilai minimal 2 juri yang bukan guru penyeleksi kelas itu
  - Tiga apresiasi: juara perorangan, juara kelas, dan **siswa paling berkembang** (kenaikan terbesar dari cek awal)
  - Panduan lengkap, rubrik, dan Lembar Nilai Babak Kelas ada di Sheet
- **Drama:** tokoh Nabi ﷺ tidak diperankan; kisahnya dibawakan narator
- **Ayat:** RA dan SD Fase A hanya juz 30; SD Fase B–C dan SMP juz 26–30 dan juz 1
- **Tujuan hafalan SD dan SMP** dijalankan lewat tadabbur, misalnya drama, infografis, puisi, cerita, buku, atau kajian, bukan sekadar setoran. Saat cek akhir, siswa menyetor ayat lalu menyebutkan satu pesan ayat dengan kata-katanya sendiri
- **Format lembar penilaian dan tanggal cek** ada di Sheet, pada lembar Rubrik & Alat Ukur dan Kalender Ukur
- **Peta ini berlaku setiap tahun.** Yang ditulis hanya bulan dan jarak hari (H-60, H-7), bukan tanggal tahun tertentu. Tanggal pasti tiap tahun ajaran ada di Sheet, lembar Kalender Ukur, dan diperbarui sekali setahun saat Raker
- **Catatan:** riwayat asbabun nuzul dan derajat hadits ditinjau Tim Tarbiyah sebelum dipakai

### PHBI · Tahun Baru Hijriah (1 Muharram)
- **Tema:** "Hijrah: pindah menjadi lebih baik, bersaudara karena Allah"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Al-Insyirah 5–6
    - Konteks: turun di Makkah saat dakwah Nabi ﷺ terasa berat, untuk menghibur beliau
    - Tadabbur: "bersama kesulitan ada kemudahan" diulang dua kali; ulama menjelaskan satu kesulitan diiringi dua kemudahan
    - Hikmah anak: saat susah, Allah pasti menolong; sabar dan berdoa
  - SD Fase B–C · QS Al-Hasyr 9
    - Asbabun nuzul: seorang Anshar dan istrinya menjamu tamu Nabi yang lapar; lampu dipadamkan agar tamu tidak tahu tuan rumah ikut menahan lapar (HR Bukhari & Muslim)
    - Tadabbur: Anshar mencintai Muhajirin dan mendahulukan mereka walau sendiri membutuhkan (itsar)
    - Hikmah anak: berbagi dengan teman walau kita juga butuh
  - SMP · QS Al-Hasyr 8–10
    - Tadabbur: tiga golongan terpuji: Muhajirin meninggalkan harta karena Allah, Anshar menolong dengan itsar, generasi sesudahnya mendoakan pendahulu dan menjaga hati dari dengki
    - Doa ayat 10 dihafal dan dibaca bersama
    - Hikmah: hijrah butuh pengorbanan; ukhuwah butuh hati yang bersih
- **Sirah terkait**
  - Hijrah Nabi ﷺ bersama Abu Bakar, bersembunyi di Gua Tsur
  - Persaudaraan Abdurrahman bin 'Auf dan Sa'd bin Rabi': ditawari harta, Abdurrahman berkata "tunjukkan aku pasar" (HR Bukhari)
- **📅 Waktu cek (perkiraan):** cek awal pekan 1 Juli · cek akhir pekan 2–3 Juli, saat kegiatan atau paling lambat sepekan sesudahnya, dan hasilnya ditulis di LPJ
- **🎖️ Target unggulan agenda ini:** Iman dan kebiasaan ibadah — menjadi Tujuan 1 di semua fase
- **🌱 Menumbuhkan:** sisi Iman dalam visi · menjalankan M2 mengenal jati diri dan makna hidup · M5 keteladanan
- **Catatan:** 1 Muharram kerap jatuh menjelang libur akhir tahun ajaran. Bila demikian, agenda ini dilaksanakan di pekan pertama tahun ajaran berikutnya, sekaligus menjadi pembuka tahun
- **RA (Fondasi)**
  - **🎯 Tujuan dan cara menilainya**
    - **Tujuan 1 · Menjalankan 1 kebiasaan baik baru**
      - 🔗 Menyumbang ke: target adab RA (RA-04)
      - 📏 Cek awal: Guru kelas melihat mutabaah atau lembar adab 2 pekan terakhir: berapa anak yang sudah menjalankan kebiasaan ini.
      - 📏 Cek akhir: Saat program berakhir, wali kelas merekap kartu: berapa hari setiap siswa menjalankannya.
      - ✅ Berhasil bila: Minimal 70% anak (7 dari setiap 10 anak) menjalankannya hampir setiap hari (8 dari 10 hari atau lebih).
      - 👤 Penanggung jawab: Guru kelas
    - **Tujuan 2 · Hafal Al-Insyirah 5–6**
      - 🔗 Menyumbang ke: target hafalan Qur'an RA (RA-01)
      - 📏 Cek awal: Guru kelas melihat buku setoran dan mencatat anak yang sudah hafal ayat ini.
      - 📏 Cek akhir: Setiap anak melafalkan ayat di depan guru tanpa persiapan khusus.
      - ✅ Berhasil bila: Minimal 70% anak (7 dari setiap 10 anak) lulus setoran.
      - 👤 Penanggung jawab: Guru kelas
    - **Tujuan 3 · Bisa menceritakan 2 hal dari kisah hijrah Nabi dan Abu Bakar**
      - 🔗 Menyumbang ke: ukuran pendukung, bukan target lulusan langsung
      - 📏 Cek awal: Guru mengajukan 3 pertanyaan bergambar kepada setiap anak sebelum kegiatan.
      - 📏 Cek akhir: Pemahaman dinilai dari karya yang dibuat siswa; bila kegiatannya tidak berupa karya, guru mengajukan 3 pertanyaan bergambar yang sama sambil berkeliling, bukan sebagai ujian tertulis.
      - ✅ Berhasil bila: Minimal 70% anak (7 dari setiap 10 anak) menjawab benar 2 dari 3 pertanyaan.
      - 👤 Penanggung jawab: Guru kelas
  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Menjalankan 1 kebiasaan baik baru**
      - **A · Memilih satu kebiasaan baik di kelas** (di sekolah)
        - Setiap anak memilih satu kebiasaan, misalnya merapikan mainan atau antre. Guru mengingatkan setiap pagi dan menempel stiker bila dijalankan, selama 2 pekan.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa
      - **B · Kartu kebiasaan baik di rumah** (bersama orang tua)
        - Anak dan orang tua memilih satu kebiasaan, misalnya bangun pagi atau berwudhu sendiri. Orang tua mencentang kartu setiap hari selama 2 pekan.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua
    - **Untuk Tujuan 2: Hafal Al-Insyirah 5–6**
      - **A · Menaiki tangga kemudahan** (permainan)
        - Dibuat 2 anak tangga kertas di lantai. Anak melangkah ke tangga pertama sambil melafalkan ayat 5, lalu ke tangga kedua sambil melafalkan ayat 6, sementara guru berkata "ada kesulitan, lalu Allah beri kemudahan". 10 menit setiap pagi selama 1 pekan.
        - 📦 Hasil nyata: catatan guru tentang siapa yang sudah bisa dan siapa yang masih perlu dibimbing
      - **B · Menempel bulan sabit tahun baru** (bersama orang tua)
        - Anak membawa pulang kertas berisi 7 bulan sabit kosong. Setiap kali anak melafalkan Al-Insyirah 5–6 di depan orang tua, satu bulan sabit diwarnai. Kertas dikembalikan ke guru setelah penuh.
        - 📦 Hasil nyata: satu kartu terisi dan ditandatangani orang tua per siswa
    - **Untuk Tujuan 3: Bisa menceritakan 2 hal dari kisah hijrah Nabi dan Abu Bakar**
      - **A · Mendengarkan kisah hijrah dengan boneka tangan** (cerita)
        - Guru bercerita 15 menit memakai boneka Nabi, Abu Bakar, dan laba-laba di Gua Tsur. Setelah itu anak menyusun 3 gambar kisah secara berurutan.
        - 📦 Hasil nyata: catatan jawaban anak atas pertanyaan cerita
      - **B · Bermain "jalan hijrah" di halaman** (permainan)
        - Halaman dibuat rute bergambar: Makkah – Gua Tsur – Madinah. Di setiap pos, guru bertanya satu hal sederhana tentang kisah hijrah sebelum anak melanjutkan.
        - 📦 Hasil nyata: catatan guru tentang siapa yang sudah bisa dan siapa yang masih perlu dibimbing
- **SD Fase A (kelas 1–2)**
  - **🎯 Tujuan dan cara menilainya**
    - **Tujuan 1 · Shalat tepat waktu selama 2 pekan**
      - 🔗 Menyumbang ke: target ibadah harian SD (SD-06)
      - 📏 Cek awal: Wali kelas melihat mutabaah atau lembar adab 2 pekan terakhir: berapa siswa yang sudah menjalankan kebiasaan ini.
      - 📏 Cek akhir: Saat program berakhir, wali kelas merekap kartu: berapa hari setiap siswa menjalankannya.
      - ✅ Berhasil bila: Minimal 70% siswa (7 dari setiap 10 siswa) menjalankannya hampir setiap hari (8 dari 10 hari atau lebih).
      - 👤 Penanggung jawab: Wali kelas
    - **Tujuan 2 · Hafal dan memahami pesan Al-Insyirah 5–6**
      - 🔗 Menyumbang ke: target hafalan Qur'an per kelas (SD-02)
      - 📏 Cek awal: Siswa menyimak berpasangan sambil mengisi kartu centang, lalu wali kelas merekap kartunya dan menguji ulang 5 siswa secara acak.

### PHBI · Maulid Nabi ﷺ (Rabiul Awal)
- **Tema:** "Mengenal dan meneladani akhlak Rasulullah ﷺ"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Ad-Duha 6–8
    - Asbabun nuzul: wahyu sempat terhenti beberapa hari; orang musyrik mengejek bahwa Muhammad telah ditinggalkan Tuhannya, lalu turun Ad-Duha (HR Bukhari & Muslim dari Jundub)
    - Tadabbur: Nabi yatim lalu dilindungi (ayah wafat sebelum lahir, ibu wafat saat beliau 6 tahun, diasuh kakek lalu paman); mencari lalu diberi petunjuk; kekurangan lalu dicukupkan
    - Hikmah anak: Allah sayang Nabi dan sayang kita; maka sayangi anak yatim (ayat 9)
  - SD Fase B–C · QS Al-Qalam 4
    - Konteks: kaum musyrik menuduh Nabi gila (ayat 2); Allah membantah dan memuji akhlak beliau
    - Tadabbur: Aisyah ra berkata akhlak Nabi adalah Al-Qur'an (HR Muslim)
    - Hikmah anak: tanda cinta Nabi adalah meniru akhlaknya
  - SMP · QS Al-Fath 29
    - Konteks: Surat Al-Fath turun dalam perjalanan pulang dari Perjanjian Hudaibiyah
    - Tadabbur: Nabi dan sahabat tegas terhadap kebatilan, berkasih sayang sesama, rajin ruku' dan sujud; diumpamakan tunas yang tumbuh menjadi batang kokoh
    - Hikmah: generasi kuat dibangun bertahap dan saling menguatkan
- **Sirah terkait**
  - Masa kecil Nabi: diasuh Halimah, kakek Abdul Muthalib, paman Abu Thalib; dijuluki Al-Amin
  - Di rumah, Nabi membantu pekerjaan keluarganya (HR Bukhari dari Aisyah)
  - Di Madinah: mempersaudarakan Muhajirin–Anshar, memimpin dengan musyawarah
  - Matan Urjuzah Mi'iyah: 100 bait sirah Nabi, cocok sebagai hafalan pekan Maulid

### PHBI · Isra' Mi'raj (Rajab)
- **Tema:** "Shalat, hadiah langsung dari langit"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Al-'Alaq 19 ("sujudlah dan dekatkan dirimu")
    - Asbabun nuzul ayat 9–19: Abu Jahal melarang dan mengancam Nabi yang shalat di dekat Ka'bah; Nabi tetap shalat (HR Muslim)
    - Tadabbur: saat paling dekat seorang hamba dengan Allah adalah ketika sujud (HR Muslim)
    - Hikmah anak: tetap shalat walau ada yang mengganggu; berdoa saat sujud
  - SD Fase B–C · QS An-Najm 13–18 + QS Al-Ma'un 4–5
    - Konteks: An-Najm menggambarkan Nabi melihat Jibril dalam rupa aslinya di Sidratul Muntaha saat Mi'raj
    - Fakta: An-Najm surat pertama berisi ayat sajdah; saat Nabi membacanya dan sujud, yang hadir ikut sujud kecuali seorang tua Quraisy (HR Bukhari dari Ibnu Mas'ud)
    - Tadabbur Al-Ma'un 4–5: celaka orang yang shalat tetapi lalai (menunda, tidak khusyuk)
    - Hikmah anak: shalat diterima Nabi langsung di langit, maka jaga waktunya
  - SMP · QS An-Najm 1–18 + QS Al-Baqarah 43 dan 45
    - Tadabbur An-Najm 3–4: Nabi tidak berbicara menurut hawa nafsunya; yang beliau sampaikan adalah wahyu
    - Al-Baqarah 45: mohon pertolongan dengan sabar dan shalat; bila menghadapi urusan berat, Nabi segera shalat (HR Abu Dawud)
    - Hikmah: shalat adalah jalan keluar masalah, bukan sekadar rutinitas
- **Sirah terkait**
  - Isra' dari Masjidil Haram ke Masjidil Aqsha, lalu Mi'raj
  - Shalat 50 waktu menjadi 5 waktu atas saran Nabi Musa (HR Bukhari & Muslim)
  - Abu Bakar langsung membenarkan, lalu bergelar Ash-Shiddiq

- **RA (Fondasi)**
  - **🎯 Tujuan dan cara menilainya**
    - **Tujuan 1 · Bisa berwudhu dan melakukan gerakan shalat dengan benar**
      - 🔗 Menyumbang ke: target praktik ibadah RA (RA-07)
      - 📏 Cek awal: Guru meminta setiap anak mempraktikkannya dan mencentang langkah yang sudah benar.
      - 📏 Cek akhir: Guru menguji lagi dengan lembar centang yang sama.
      - ✅ Berhasil bila: Minimal 75% anak (3 dari setiap 4 anak) melakukannya dengan benar.
      - 👤 Penanggung jawab: Guru kelas
    - **Tujuan 2 · Hafal Al-'Alaq 19 dan doa setelah wudhu**
      - 🔗 Menyumbang ke: target hafalan Qur'an RA (RA-01) · target doa harian RA (RA-03)
      - 📏 Cek awal: Guru kelas melihat buku setoran dan mencatat anak yang sudah hafal ayat ini.
      - 📏 Cek akhir: Setiap anak melafalkan ayat di depan guru tanpa persiapan khusus.
      - ✅ Berhasil bila: Minimal 70% anak (7 dari setiap 10 anak) hafal ayat dan doanya.
      - 👤 Penanggung jawab: Guru kelas
    - **Tujuan 3 · Ikut shalat bersama keluarga minimal 1 waktu sehari**
      - 🔗 Menyumbang ke: ukuran pendukung, menunjang target praktik ibadah RA (RA-07)
      - 📏 Cek awal: Guru kelas melihat mutabaah atau lembar adab 2 pekan terakhir: berapa anak yang sudah menjalankan kebiasaan ini.
      - 📏 Cek akhir: Saat program berakhir, wali kelas merekap kartu: berapa hari setiap siswa menjalankannya.
      - ✅ Berhasil bila: Minimal 70% anak (7 dari setiap 10 anak) menjalankannya hampir setiap hari (8 dari 10 hari atau lebih).
      - 👤 Penanggung jawab: Guru kelas
  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Bisa berwudhu dan melakukan gerakan shalat dengan benar**
      - **A · Pos-pos latihan wudhu** (praktik)
        - Disiapkan 4 pos: membasuh tangan, berkumur, membasuh wajah, membasuh kaki. Anak berpindah pos dan guru membetulkan caranya.
        - 📦 Hasil nyata: satu lembar centang praktik per siswa
      - **B · Lagu urutan wudhu dan latihan berpasangan** (permainan)
        - Anak menyanyikan lagu urutan wudhu, lalu berpasangan saling mengamati dan mengingatkan urutannya.
        - 📦 Hasil nyata: catatan guru tentang siapa yang sudah bisa dan siapa yang masih perlu dibimbing
    - **Untuk Tujuan 2: Hafal Al-'Alaq 19 dan doa setelah wudhu**
      - **A · Melafalkan ayat lalu bersujud tenang** (praktik)
        - Anak melafalkan Al-'Alaq 19, lalu bersujud dengan tenang dalam hitungan tiga, agar merasakan makna "sujudlah dan dekatkan dirimu". Doa setelah wudhu dinyanyikan bersama setiap selesai wudhu, selama 1 pekan.
        - 📦 Hasil nyata: satu esai per siswa
      - **B · Kartu doa bergambar di rumah** (bersama orang tua)
        - Orang tua menyimak anak membaca doa setelah wudhu dan melafalkan ayat setiap selesai berwudhu, lalu mencentang kartu selama 7 hari.
        - 📦 Hasil nyata: satu esai per siswa
    - **Untuk Tujuan 3: Ikut shalat bersama keluarga minimal 1 waktu sehari**
      - **A · Shalat dhuha bersama di kelas** (di sekolah)
        - Setiap pagi anak ikut shalat dhuha bersama guru, lalu diajak melanjutkan shalat bersama keluarga di rumah.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa
      - **B · Kartu "aku shalat bersama Ayah/Bunda"** (bersama orang tua)
        - Orang tua mencentang setiap kali anak ikut shalat bersama, selama 2 pekan.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua

  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Bisa berwudhu dan shalat dengan urutan dan bacaan yang benar**
      - **A · Pos-pos latihan wudhu di kelas** (praktik)
        - Siswa berlatih wudhu di beberapa pos, guru mencentang setiap langkah yang sudah benar.
        - 📦 Hasil nyata: satu lembar centang praktik per siswa
      - **B · Lomba menyusun kartu gerakan shalat** (permainan)
        - Kelompok berlomba menyusun kartu gerakan shalat dengan urutan yang benar, lalu setiap siswa mempraktikkannya.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua
    - **Untuk Tujuan 2: Hafal dan memahami pesan Al-'Alaq 19**
      - **A · Menyusun tangga langit** (permainan)
        - Di dinding kelas ditempel tangga bergambar tujuh lapis langit. Setiap siswa yang lulus melafalkan ayat menempelkan bintang namanya satu tingkat lebih tinggi, sampai semua sampai di puncak.
        - 📦 Hasil nyata: catatan guru tentang siapa yang sudah bisa dan siapa yang masih perlu dibimbing
      - **B · Menyetor ayat sesudah shalat maghrib** (bersama orang tua)
        - Selama 5 hari, sesudah shalat maghrib berjamaah di rumah, anak melafalkan Al-'Alaq 19 di depan orang tua. Orang tua mencentang kartu dan menuliskan satu kalimat tentang shalat anak hari itu.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua
    - **Untuk Tujuan 3: Shalat 5 waktu dengan bimbingan orang tua**
      - **A · Kartu shalat bergambar** (di sekolah)
        - Siswa menempel stiker untuk setiap shalat. Wali kelas mengecek setiap Jumat.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua
      - **B · Pengingat shalat bersama keluarga** (bersama orang tua)
        - Orang tua dan anak menyepakati cara mengingatkan 5 waktu shalat di rumah, lalu mencentang kartu shalat.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua

  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Bisa adzan dan iqamah dengan benar**

        - Semua siswa diuji azan dan iqamah di kelas dengan lembar centang yang sama. Finalis dari setiap kelas tampil saat peringatan Isra' Mi'raj, dan azan Zuhur hari itu dikumandangkan oleh pemenangnya.
        - 📦 Hasil nyata: catatan nilai semua siswa di babak kelas, bukan hanya finalis
      - **B · Bergiliran menjadi muadzin kelas** (di sekolah)
        - Selama sebulan, setiap dzuhur satu siswa mengumandangkan adzan. Teman menilai dengan lembar centang sederhana.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa

        - 📦 Hasil nyata: satu komik per siswa, dipajang di kelas
      - **B · Infografis tadabbur An-Najm 13–18** (proyek siswa)
        - Kelompok membuat poster atau infografis berisi An-Najm 13–18, artinya, 3 hikmah, dan contohnya dalam kehidupan sekarang (menjaga shalat di tengah kesibukan dan gawai). Dipajang di sekolah dan dipresentasikan 3 menit; setiap anggota menyetor ayatnya.
        - 📦 Hasil nyata: satu lembar infografis per kelompok, dipajang di sekolah
    - **Untuk Tujuan 3: Shalat lima waktu dan shalat dhuha**
      - **A · Shalat dhuha bersama saat istirahat pertama** (di sekolah)
        - Setiap hari dipimpin siswa secara bergiliran; wali kelas mencatat yang ikut.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa
      - **B · Lembar mutabaah ditandatangani orang tua** (bersama orang tua)
        - Selama 30 hari siswa mengisi lembar harian (shalat 5 waktu dan dhuha). Orang tua menandatangani setiap akhir pekan, dan wali kelas membahasnya singkat setiap Jumat.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua

      - **B · Tantangan kelompok shalat di awal waktu** (proyek siswa)
        - Kelompok 5 siswa saling mengingatkan lewat pesan; yang dinilai adalah kelompok, bukan perorangan.
        - 📦 Hasil nyata: satu karya per siswa atau per kelompok, ditampilkan di kelas

### PHBI · Ramadhan (Tarhib, Pesantren Ramadhan, Nuzulul Qur'an)
- **Tema:** "Ramadhan, bulan Al-Qur'an"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Al-Qadr
    - Konteks: Al-Qur'an diturunkan pada Lailatul Qadar di bulan Ramadhan
    - Tadabbur: satu malam lebih baik dari seribu bulan (sekitar 83 tahun); malaikat turun; damai sampai fajar
    - Hikmah anak: hidupkan malam Ramadhan; doa yang diajarkan Nabi kepada Aisyah "Allahumma innaka 'afuwwun tuhibbul 'afwa fa'fu 'anni" (HR Tirmidzi)
  - SD Fase B–C · QS Al-Qadr + QS Al-'Alaq 1–5
    - Sirah: Jibril datang di Gua Hira membawa "iqra'"; Nabi pulang gemetar, Khadijah menenangkan dan membawanya ke Waraqah bin Naufal (HR Bukhari)
    - Hikmah anak: perintah pertama dalam Islam adalah membaca; Ramadhan bulan membaca Al-Qur'an
  - SMP · QS Al-Muzzammil 1–6 + QS Al-Baqarah 2
    - Konteks: di awal kenabian, Nabi diperintah bangun malam dan membaca dengan tartil sebagai bekal amanah berat (ayat 5)
    - Tadabbur: bangun malam lebih kuat pengaruhnya dan bacaan lebih berkesan (ayat 6); Al-Qur'an petunjuk bagi yang bertakwa, sejalan dengan tujuan puasa
    - Hikmah: kekuatan pribadi dibangun dari ibadah malam dan Al-Qur'an

  - Setiap malam Ramadhan Jibril bertadarus Al-Qur'an bersama Nabi, dan Nabi paling dermawan di bulan itu (HR Bukhari)
  - Nabi beri'tikaf di sepuluh malam terakhir

        - Dipasang 10 lampu kertas untuk sepuluh malam terakhir. Setiap pagi satu lampu dinyalakan (ditempel) oleh anak yang melafalkan Al-Qadr dengan benar, sambil guru menjelaskan satu malam yang lebih baik dari seribu bulan.

        - Menjelang azan maghrib, orang tua menyimak anak melafalkan Al-Qadr, lalu mereka berdoa bersama. Dicentang di jurnal Ramadhan selama 7 hari.
        - 📦 Hasil nyata: satu kartu terisi per siswa, ditandatangani orang tua
    - **Untuk Tujuan 2: Hafal doa berbuka dan doa sahur**
      - **A · Menyanyikan doa berbuka dan sahur** (di sekolah)

      - **B · Memimpin doa berbuka di rumah** (bersama orang tua)

### PHBI · Idul Fitri & Halal bi Halal (Syawal)
- **Tema:** "Saling memaafkan dan menjaga persaudaraan"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS An-Nasr
    - Konteks: turun menjelang akhir hayat Nabi; Ibnu Abbas memahaminya sebagai tanda dekatnya wafat Nabi (HR Bukhari)
    - Tadabbur: saat menang dan bahagia, perbanyak tasbih, tahmid, dan istighfar, bukan berbangga
    - Hikmah anak: hari raya untuk bersyukur dan meminta maaf
  - SD Fase B–C · QS An-Nasr + QS Al-Hujurat 10
    - Konteks ayat 9–10: dua kelompok kaum muslimin berselisih, Allah perintahkan mendamaikan (HR Bukhari & Muslim)
    - Tadabbur: orang beriman itu bersaudara; tugas kita mendamaikan yang bertengkar
    - Hikmah anak: jadilah pendamai di kelas
  - SMP · QS Al-Hujurat 10–12
    - Asbabun nuzul ayat 11: di Bani Salimah ada orang yang dipanggil dengan julukan yang tidak disukainya (HR Abu Dawud)
    - Tadabbur: larangan mengejek, memberi julukan buruk, berprasangka, memata-matai, dan ghibah (seperti memakan daging saudara yang telah mati)
    - Hikmah: sangat relevan dengan perundungan dan percakapan di grup media sosial

### PHBI · Idul Adha (Dzulhijjah)
- **Tema:** "Taat dan berkorban seperti Nabi Ibrahim dan Ismail"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Al-Kautsar
    - Asbabun nuzul (riwayat dalam kitab tafsir, bukan dari Bukhari-Muslim): setelah putra Nabi wafat, seorang pembesar Quraisy mengejek beliau "terputus keturunannya"; Allah menjawab bahwa pembenci Nabi-lah yang terputus
    - Tadabbur: Al-Kautsar adalah nikmat yang sangat banyak, termasuk sungai di surga (HR Muslim); syukurnya dengan shalat dan berkurban
    - Hikmah anak: bersyukur dengan shalat dan berbagi daging kurban
  - SD Fase B–C · QS Al-Baqarah 127
    - Konteks: Ibrahim dan Ismail membangun Ka'bah sambil berdoa "Rabbana taqabbal minna"
    - Tadabbur: setelah beramal tetap berdoa agar diterima; ayah dan anak bekerja sama dalam ketaatan
    - Hikmah anak: membantu orang tua sambil berdoa
  - SMP · QS Al-Baqarah 124–129 + QS An-Najm 37
    - Tadabbur: Ibrahim diuji dengan beberapa perintah, menunaikannya, lalu dijadikan pemimpin (ayat 124); doanya di ayat 129 agar diutus rasul dari keturunannya terkabul dengan diutusnya Nabi Muhammad ("aku adalah doa ayahku Ibrahim", HR Ahmad)
    - An-Najm 37: Ibrahim yang menyempurnakan janji
    - Hikmah: kepemimpinan lahir dari ketaatan dan lulus ujian
- **Sirah terkait**
  - Kisah Ibrahim dan Ismail
  - Hajar berlari antara Shafa dan Marwah, lalu memancar air Zamzam (HR Bukhari), asal ibadah sa'i
- **📅 Waktu cek (perkiraan):** cek awal 3–7 Mei · cek akhir 18–24 Mei, saat kegiatan atau paling lambat sepekan sesudahnya, dan hasilnya ditulis di LPJ
- **🎖️ Target unggulan agenda ini:** Ibadah dan fiqih kurban — menjadi Tujuan 1 di semua fase
- **🌱 Menumbuhkan:** sisi Islam dalam visi · menjalankan M1 memadukan kurikulum dan ajaran Islam · M5 keteladanan

### PHBN · HUT RI (17 Agustus)
- **Tema:** "Mensyukuri nikmat aman dan merdeka"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS Quraisy
    - Konteks: Quraisy diberi nikmat perjalanan dagang musim dingin (ke Yaman) dan musim panas (ke Syam), diberi makan dan rasa aman; bersambung dengan Al-Fil, saat Allah menjaga Ka'bah
    - Tadabbur: balasan nikmat makan dan rasa aman adalah menyembah Allah
    - Hikmah anak: negeri yang aman dan merdeka adalah nikmat; syukuri dengan ibadah
  - SD Fase B–C · QS Quraisy + QS Ar-Rahman 13
    - Tadabbur: ayat 13 diulang 31 kali; ketika Nabi membacakan Ar-Rahman kepada jin, mereka menjawab setiap ayat itu "tidak ada satu pun nikmat-Mu yang kami dustakan" (HR Tirmidzi)
    - Hikmah anak: biasakan menyebut dan mensyukuri nikmat
  - SMP · QS Ar-Rahman 1–13 + QS Ash-Shaff 4
    - Asbabun nuzul Ash-Shaff: para sahabat ingin tahu amal yang paling dicintai Allah, lalu turun surat ini (HR Tirmidzi)
    - Tadabbur: Allah mencintai barisan yang kokoh seperti bangunan tersusun rapi; Ar-Rahman 7–9 tentang keseimbangan dan keadilan
    - Hikmah: menjaga negeri butuh disiplin, kerja sama, dan keadilan
- **Sirah terkait**
  - Saat hijrah, Nabi berkata kepada Makkah: "engkaulah negeri yang paling aku cintai" (HR Tirmidzi), cinta tanah air
  - Peran ulama dan santri dalam perjuangan kemerdekaan

### PHBN · Hari Guru / HUT PGRI (25 November)
- **Tema:** "Adab kepada guru dan semangat menuntut ilmu"
- **Ayat dan tadabbur**
  - RA & SD Fase A · QS 'Abasa 1–4
    - Asbabun nuzul: Abdullah bin Ummi Maktum yang buta datang meminta diajari ketika Nabi sedang berdakwah kepada pembesar Quraisy; Nabi bermuka masam, lalu Allah menegur beliau (HR Tirmidzi)
    - Sesudahnya Nabi memuliakannya: ia menjadi muadzin dan beberapa kali ditunjuk menggantikan Nabi di Madinah
    - Hikmah anak: setiap orang yang mau belajar itu mulia; contoh semangat Ibnu Ummi Maktum
  - SD Fase B–C · QS Al-Mujadilah 11
    - Konteks (riwayat dalam kitab tafsir): sahabat ahli Badar datang ke majelis Nabi tetapi tidak mendapat tempat, lalu Nabi meminta sebagian memberi tempat
    - Tadabbur: berlapang-lapang di majelis ilmu; Allah meninggikan orang beriman dan berilmu
    - Hikmah anak: adab di kelas: memberi tempat dan mendengarkan guru
  - SMP · QS Al-Hujurat 1–5
    - Asbabun nuzul: Abu Bakar dan Umar meninggikan suara saat berbeda pendapat di dekat Nabi (HR Bukhari); Tsabit bin Qais yang bersuara keras khawatir amalnya terhapus, lalu Nabi mengabarkan ia penghuni surga (HR Bukhari & Muslim)
    - Tadabbur: tidak mendahului, tidak meninggikan suara, sabar menunggu, seperti adab kepada Nabi
    - Hikmah: adab yang sama diterapkan kepada guru dan orang tua
- **Sirah terkait**
  - Hadits Jibril (Arbain no. 2): Jibril duduk merapat di hadapan Nabi, menunjukkan adab murid
  - Imam Syafi'i membuka lembaran kitab dengan pelan di depan Imam Malik

      - 📏 Cek akhir: Setiap siswa menyetor ayat tanpa persiapan khusus, lalu menyebutkan satu pesan ayat itu dengan kata-katanya sendiri.
      - ✅ Berhasil bila: Minimal 80% siswa (8 dari setiap 10 siswa) lulus setoran ayat dan bisa menyebutkan satu pesan ayatnya; minimal 70% siswa (7 dari setiap 10 siswa) lulus setoran hadits.
      - 👤 Penanggung jawab: Koordinator TTQ unit
    - **Tujuan 3 · Bisa menjelaskan adab murid dari hadits Jibril di depan orang lain**
      - 🔗 Menyumbang ke: ukuran pendukung, bukan target lulusan langsung
      - 📏 Cek awal: Guru menilai setiap siswa saat berbicara di depan kelas dengan lembar penilaian bicara.
      - 📏 Cek akhir: Guru menilai semua siswa saat tampil di babak kelas pekan H-7, dengan lembar yang sama.
      - ✅ Berhasil bila: Siswa yang nilainya Baik atau Sangat Baik bertambah minimal 1 dari setiap 10 siswa. Contoh: di kelas berisi 30 siswa, dari 15 menjadi 18 siswa atau lebih.
      - 👤 Penanggung jawab: Guru bahasa atau wali kelas
  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Menjaga adab kepada guru di kelas**
      - **A · Surat untuk guru dan janji adab** (di kelas)
        - Siswa menulis surat terima kasih untuk guru yang berisi 1 janji adab, lalu janji itu dicek bersama di akhir bulan.
        - 📦 Hasil nyata: satu surat per siswa, diserahkan langsung kepada yang dituju
      - **B · Tantangan 2 pekan kelas tanpa teguran** (proyek siswa)
        - Dikelola pengurus kelas: jumlah teguran ditulis di papan setiap hari.
        - 📦 Hasil nyata: satu karya per siswa atau per kelompok, ditampilkan di kelas
    - **Untuk Tujuan 2: Hafal dan memahami pesan Al-Mujadilah 11 dan hadits Arbain no. 2 dari awal sampai penjelasan Islam**
      - **A · Cerita pendek bertema beradab kepada guru** (di kelas)
        - Siswa menulis cerita 1 halaman tentang anak masa kini yang belajar beradab kepada guru di kelas dan di chat, ditutup dengan Al-Mujadilah 11 sebagai pesannya. Beberapa cerita dibacakan, lalu setiap siswa menyetor ayatnya. Hadits pada tujuan ini juga disetor.
        - 📦 Hasil nyata: satu cerita satu halaman per siswa, beberapa dibacakan di kelas
      - **B · Puisi dari makna Al-Mujadilah 11** (di kelas)
        - Setelah tadabbur bersama tentang Al-Mujadilah 11, siswa menulis puisi 8–12 baris tentang beradab kepada guru di kelas dan di chat, diawali kutipan arti ayat. Puisi dibacakan bergantian, lalu setiap siswa menyetor ayatnya. Hadits pada tujuan ini juga disetor.
        - 📦 Hasil nyata: satu puisi per siswa, dibacakan di kelas
    - **Untuk Tujuan 3: Bisa menjelaskan adab murid dari hadits Jibril di depan orang lain**
      - **A · Menjadi guru sehari untuk adik kelas** (di sekolah)
        - Siswa berpasangan mengajar adik kelas selama 10 menit tentang adab murid kepada guru, dari kisah Jibril yang duduk merapat di hadapan Nabi.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa
      - **B · Poster dan presentasi "5 adab murid"** (proyek siswa)
        - Kelompok membuat poster lalu mempresentasikannya 5 menit di depan kelas.
        - 📦 Hasil nyata: satu poster per kelompok, dipajang di kelas
- **SMP (Fase D)**
  - **🎯 Tujuan dan cara menilainya**
    - **Tujuan 1 · Hafal dan memahami pesan Al-Hujurat 1–5 dan hadits Arbain no. 2 lengkap**
      - 🔗 Menyumbang ke: target hafalan Qur'an per kelas (SMP-02) · target hafalan hadits per kelas (SMP-14)
      - 📏 Cek awal: Siswa menyimak berpasangan sambil mengisi kartu centang, lalu wali kelas merekap kartunya dan menguji ulang 5 siswa secara acak.
      - 📏 Cek akhir: Setiap siswa menyetor ayat tanpa persiapan khusus, lalu menyebutkan satu pesan ayat itu dengan kata-katanya sendiri.
      - ✅ Berhasil bila: Minimal 85% siswa (17 dari setiap 20 siswa) lulus setoran ayat dan bisa menyebutkan satu pesan ayatnya; minimal 80% siswa (8 dari setiap 10 siswa) lulus setoran hadits.
      - 👤 Penanggung jawab: Koordinator TTQ unit
    - **Tujuan 2 · Bisa menghubungkan Al-Hujurat 1–5 dengan adab di kelas dan di grup chat bersama guru**
      - 🔗 Menyumbang ke: ukuran pendukung, menunjang target adab & kepemimpinan SMP (SMP-11)
      - 📏 Cek awal: Guru menilai tulisan siswa sebelum kegiatan dengan lembar penilaian menulis.
      - 📏 Cek akhir: Guru menilai hasil karya siswa dengan lembar yang sama; karya itu sendiri menjadi buktinya, tanpa tes tambahan.
      - ✅ Berhasil bila: Siswa yang tulisannya bernilai Baik atau Sangat Baik bertambah minimal 1 dari setiap 10 siswa. Contoh: di kelas berisi 30 siswa, dari 15 menjadi 18 siswa atau lebih.
      - 👤 Penanggung jawab: Wali kelas atau guru Bahasa
    - **Tujuan 3 · Tidak memotong, tidak meninggikan suara, dan berani memimpin kebaikan**
      - 🔗 Menyumbang ke: target adab & kepemimpinan SMP (SMP-11)
      - 📏 Cek awal: Wali kelas mendata siswa yang sudah pernah memimpin, misalnya menjadi ketua kelompok, petugas upacara, atau pembawa acara.
      - 📏 Cek akhir: Wali kelas memperbarui data itu setelah kegiatan.
      - ✅ Berhasil bila: Dalam satu kelas, minimal 5 siswa yang sebelumnya belum pernah memimpin kini mendapat giliran memimpin.
      - 👤 Penanggung jawab: Wali kelas atau pembina OSIS
  - **🧩 Pilihan kegiatan — pilih satu untuk tiap tujuan**
    - **Untuk Tujuan 1: Hafal dan memahami pesan Al-Hujurat 1–5 dan hadits Arbain no. 2 lengkap**
      - **A · Naskah dan kultum 5 menit** (proyek siswa)
        - Setiap siswa menulis naskah kultum satu halaman tentang beradab kepada guru berdasarkan Al-Hujurat 1–5, lalu menyampaikannya 5 menit setelah shalat zuhur secara bergiliran. Naskahnya dikumpulkan menjadi bundel kultum kelas. Hadits pada tujuan ini juga disetor.
        - 📦 Hasil nyata: satu naskah kultum per siswa dan satu giliran tampil, dibundel jadi kumpulan kultum kelas
      - **B · Infografis digital (digital)** (proyek siswa)
        - Kelompok membuat infografis di komputer sekolah atau ponsel: Al-Hujurat 1–5, artinya, tiga pesan, dan contoh nyata tentang beradab kepada guru di kelas dan di chat. File dicetak satu lembar untuk dipajang dan dibagikan di grup kelas. Juga dihitung untuk target proyek digital (SMP-08). Hadits pada tujuan ini juga disetor.
        - 📦 Hasil nyata: satu lembar infografis per kelompok, dipajang di sekolah
    - **Untuk Tujuan 2: Bisa menghubungkan Al-Hujurat 1–5 dengan adab di kelas dan di grup chat bersama guru**
      - **A · Bundel surat terima kasih untuk guru** (proyek siswa)
        - Setiap siswa menulis satu surat untuk gurunya, berisi satu kebaikan yang ia ingat dan satu janji adab. Surat dijilid per kelas dan diserahkan kepada guru pada Hari Guru.
        - 📦 Hasil nyata: satu surat per siswa, diserahkan langsung kepada yang dituju
      - **B · Menyusun aturan chat dengan guru** (proyek siswa)
        - Kelas menyusun 5 aturan berkomunikasi dengan guru lewat chat, berdasarkan ayat 1–5, lalu disepakati bersama wali kelas.
        - 📦 Hasil nyata: satu karya per siswa atau per kelompok, ditampilkan di kelas
    - **Untuk Tujuan 3: Tidak memotong, tidak meninggikan suara, dan berani memimpin kebaikan**
      - **A · Penghargaan guru dirancang OSIS** (proyek siswa)
        - OSIS menyusun kriteria penghargaan guru bersama siswa, mengumpulkan pilihan, dan memimpin acara.
        - 📦 Hasil nyata: satu karya per siswa atau per kelompok, ditampilkan di kelas
      - **B · Pekan tidak memotong pembicaraan guru** (di sekolah)
        - Selama 2 pekan setiap kelas mencatat sendiri kejadian memotong pembicaraan guru dan membahasnya setiap Jumat.
        - 📦 Hasil nyata: catatan guru tentang capaian setiap siswa
